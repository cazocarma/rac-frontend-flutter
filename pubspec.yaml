publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  oidc: 5.0.2
  oidc_web_core: 1.2.2
  oidc_default_store: 2.0.0
