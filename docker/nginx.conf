server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OAuth responses contain short-lived codes and state in their query.
    # Suppress those requests at the static server as well as the gateway.
    location ~ ^/(?:staff/)?redirect\.html$ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
